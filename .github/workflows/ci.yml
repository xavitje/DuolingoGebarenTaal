name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Voorkomt dat meerdere runs op dezelfde branch tegelijk lopen (bv. snel na elkaar pushen) —
# een nieuwe run annuleert de vorige, nog lopende run voor diezelfde branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # google-services.json bestaat bewust niet in de repo (bevat projectspecifieke Firebase-
      # config, zie composeApp/build.gradle.kts) — de build detecteert dit zelf en slaat het
      # google-services-plugin dan over, dus dit is geen probleem voor CI.

      - name: Unit tests (shared + composeApp)
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composeApp-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
